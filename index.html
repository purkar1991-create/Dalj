<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TajniGrad: Dalj</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e11;--panel:#181a1f;--line:#2b2e36;--gold:#d6a94a;--teal:#2ec4b6;--txt:#ebe6d8;--mut:#9a9684;--bad:#e0675a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:'Source Sans 3',system-ui,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:inherit}
.dark-tiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.leaflet-control-attribution{background:rgba(13,14,17,.7)!important;color:var(--mut)!important}
.leaflet-control-attribution a{color:var(--teal)!important}
header{position:absolute;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:700 19px 'Cinzel',Georgia,serif;margin:0;color:var(--gold);letter-spacing:.04em}
.btn{border:1px solid var(--gold);background:var(--panel);color:var(--gold);font:600 14px inherit;font-family:inherit;padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.teal{border-color:var(--teal);color:var(--teal)}
.btn.fill{background:var(--gold);color:#17130a}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.prog{margin-top:9px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
.bar{flex:1;display:flex;gap:5px}
.bar i{flex:1;height:7px;border-radius:4px;background:var(--line);transition:background .4s}
.bar i.on{background:linear-gradient(90deg,var(--gold),var(--teal))}
.fabs{position:absolute;z-index:1000;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.demo{position:absolute;z-index:1000;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.demo.on{background:var(--teal);color:#06211e}
#toast{position:absolute;z-index:2000;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);max-width:88%;background:var(--panel);border:1px solid var(--gold);padding:10px 14px;border-radius:10px;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
.modal{position:absolute;inset:0;z-index:3000;background:rgba(5,5,7,.78);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--panel);border-top:2px solid var(--gold);border-radius:18px 18px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet h2{font:700 21px 'Cinzel',Georgia,serif;color:var(--gold);margin:0 0 4px}
.sheet .sub{color:var(--teal);font-size:14px;margin:0 0 12px}
.sheet p{line-height:1.55;font-size:17px;margin:0 0 14px;max-width:62ch}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font:inherit;font-size:17px;margin-bottom:10px}
.err{color:var(--bad);min-height:20px;font-size:14px;margin:0 0 6px}
.item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.item.lock{opacity:.45}
.item b{display:block;color:var(--gold)}
.item span{font-size:14px;color:var(--mut)}
.ico{font-size:30px;width:42px;text-align:center}
.me{width:18px;height:18px;border-radius:50%;background:var(--teal);border:3px solid #fff;box-shadow:0 0 0 0 rgba(46,196,182,.7);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 18px rgba(46,196,182,0)}100%{box-shadow:0 0 0 0 rgba(46,196,182,0)}}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold);border:2px solid #17130a;display:flex;align-items:center;justify-content:center}
.pin b{transform:rotate(45deg);font:700 15px 'Cinzel',serif;color:#17130a}
.pin.done{background:var(--teal)}.pin.lock{background:#555}
@media(prefers-reduced-motion:reduce){.me{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <div class="row"><h1>TajniGrad: Dalj</h1><button class="btn" id="bagBtn">🎒 Ruksak</button></div>
  <div class="prog"><span id="progTxt">0/3</span><div class="bar"><i></i><i></i><i></i></div></div>
</header>
<div id="toast"></div>
<button class="btn demo" id="demoBtn">Testni način: isključen</button>
<div class="fabs"><button class="btn teal" id="centerBtn">◎ Centriraj na mene</button></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const STATIONS=[
 {id:1,name:"Kuća putnika kroz vrijeme",lat:45.4908,lng:18.9875,r:40,answer:"crni bor",
  riddle:"Ovdje je rođen čovjek koji je izračunao kako Zemlja pleše oko Sunca i kada dolaze ledena doba. U njegovom vrtu još uvijek stoji jedan živi svjedok iz 1879. godine. Koje je vrste to stablo?",
  hint:"Kulturni i znanstveni centar Milutin Milanković",
  artifact:{icon:"🧭",name:"Nebeski kompas",desc:"Pokazuje put kroz zvijezde i stoljeća."},
  next:"Kompas se okreće prema središtu mjesta. Idi do crkve sv. Dimitrija i potraži sjenu rimskog kastela."},
 {id:2,name:"Sjena rimskog kastela",lat:45.4839,lng:18.9858,r:40,answer:"1715",
  riddle:"Prije dvije tisuće godina ovdje su koračali rimski legionari čuvajući granicu na Dunavu pod imenom Teutoburgium. Pogledaj najstariji sačuvani hram u središtu mjesta i upiši godinu njegove izgradnje (18. stoljeće).",
  hint:"Centar Dalja, crkva sv. Dimitrija",
  artifact:{icon:"🗿",name:"Daljski idol",desc:"Čuvar granice koji pamti legionare."},
  next:"Idol šapće o vodi. Spusti se do šetnice uz Dunav kod Patrijaršijskog dvora."},
 {id:3,name:"Šapat velike rijeke",lat:45.4872,lng:18.9892,r:50,answer:"dunav",
  riddle:"Stani uz vodu koja teče pored Dalja već tisućama godina i okreni se prema zdanju iz 1828. godine. Da bi otvorio završnu škrinju, upiši tajnu riječ: DUNAV",
  hint:"Šetnica uz Dunav kod Patrijaršijskog dvora",
  artifact:{icon:"🏆",name:"Zlatna škrinja",desc:"Posljednja nagrada potrage."},
  next:""}
];
const KEY="tajnigrad-dalj";
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.solved=S.solved||[];S.msg=S.msg||"";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);

const map=L.map('map',{zoomControl:false}).setView([45.4833,18.9833],15);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:'dark-tiles',referrerPolicy:'origin',attribution:'© OpenStreetMap contributors'}).addTo(map)
 .once('tileerror',()=>toast("Karta se ne učitava. Otvori stranicu preko https:// adrese (npr. GitHub Pages), ne kao lokalnu datoteku."));

let player=null,demo=false,watchId=null,meMarker=null,accCircle=null,firstFix=true;
const opened=new Set();

function dist(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t;
 const h=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3200)}
const solved=id=>S.solved.includes(id);
const unlocked=s=>s.id===1||solved(s.id-1);

const markers={},circles={};
function pinIcon(s){const c=solved(s.id)?'done':unlocked(s)?'':'lock';
 return L.divIcon({className:'',html:`<div class="pin ${c}"><b>${s.id}</b></div>`,iconSize:[34,34],iconAnchor:[17,34]})}
STATIONS.forEach(s=>{
 circles[s.id]=L.circle([s.lat,s.lng],{radius:s.r,color:'#d6a94a',weight:1.5,fillColor:'#2ec4b6',fillOpacity:.12,dashArray:'4 6'}).addTo(map);
 markers[s.id]=L.marker([s.lat,s.lng],{icon:pinIcon(s)}).addTo(map).on('click',()=>tapStation(s));
});
function refresh(){
 STATIONS.forEach(s=>markers[s.id].setIcon(pinIcon(s)));
 const n=S.solved.length;$('progTxt').textContent=n+'/3';
 document.querySelectorAll('.bar i').forEach((b,i)=>b.classList.toggle('on',i<n));
}

function setPlayer(lat,lng,acc){
 player={lat,lng};
 if(!meMarker){meMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18]}),zIndexOffset:1000}).addTo(map);
  accCircle=L.circle([lat,lng],{radius:acc||10,color:'#2ec4b6',weight:1,fillOpacity:.08}).addTo(map)}
 else{meMarker.setLatLng([lat,lng]);accCircle.setLatLng([lat,lng]).setRadius(acc||10)}
 checkProximity();
}
function checkProximity(){
 if(!player||$('modal').classList.contains('open'))return;
 STATIONS.forEach(s=>{
  const inside=dist(player,s)<=s.r;
  if(inside&&unlocked(s)&&!solved(s.id)&&!opened.has(s.id)){opened.add(s.id);openRiddle(s)}
  if(!inside)opened.delete(s.id);
 });
}
function startGPS(){
 if(!navigator.geolocation){toast("Ovaj preglednik ne podržava GPS. Koristi testni način.");return}
 watchId=navigator.geolocation.watchPosition(p=>{
  if(demo)return;
  setPlayer(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
  if(firstFix){firstFix=false;map.setView([p.coords.latitude,p.coords.longitude],17)}
 },e=>toast(e.code===1?"GPS dozvola odbijena. Dozvoli lokaciju ili uključi testni način.":"Lokacija trenutno nije dostupna."),
 {enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}
$('centerBtn').onclick=()=>{player?map.setView([player.lat,player.lng],Math.max(map.getZoom(),17)):toast("Lokacija još nije pronađena.")};
$('demoBtn').onclick=()=>{
 demo=!demo;const b=$('demoBtn');b.classList.toggle('on',demo);
 b.textContent='Testni način: '+(demo?'uključen':'isključen');
 toast(demo?"Dodirni točku na karti da se premjestiš tamo.":"Vraćen je stvarni GPS.");
};
map.on('click',e=>{if(!demo)return;opened.clear();setPlayer(e.latlng.lat,e.latlng.lng,5)});

function tapStation(s){
 if(!unlocked(s)){toast(`Prvo riješi postaju ${s.id-1}.`);return}
 if(solved(s.id)){openRiddle(s);return}
 if(!player){toast("Još nema tvoje lokacije. Pričekaj GPS ili uključi testni način.");return}
 const d=Math.round(dist(player,s));
 if(d<=s.r||demo){openRiddle(s)}
 else toast(`Još si udaljen ${d} m. Priđi na ${s.r} m ili bliže.`);
}

function modal(html){$('sheet').innerHTML=html;$('modal').classList.add('open')}
function close(){$('modal').classList.remove('open')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});

function openRiddle(s){
 if(solved(s.id)){
  modal(`<h2>${s.name}</h2><p class="sub">Riješeno ✓</p><p>${s.artifact.icon} ${s.artifact.name}: ${s.artifact.desc}</p>${s.next?`<p>${s.next}</p>`:''}<button class="btn" onclick="close()">Zatvori</button>`);
  if(s.id===3)finale();return}
 modal(`<h2>Postaja ${s.id}: ${s.name}</h2><p class="sub">${s.hint}</p><p>${s.riddle}</p>
 <input id="ans" autocomplete="off" autocapitalize="none" placeholder="Tvoj odgovor">
 <div class="err" id="err"></div>
 <div class="row"><button class="btn" onclick="close()">Zatvori</button><button class="btn fill" id="go">Provjeri odgovor</button></div>`);
 const f=()=>{
  const v=$('ans').value.trim().toLowerCase().replace(/\s+/g,' ');
  if(v===s.answer){S.solved.push(s.id);save();refresh();reward(s)}
  else{$('err').textContent="Nije točno. Pročitaj zagonetku još jednom.";$('ans').select()}
 };
 $('go').onclick=f;$('ans').onkeydown=e=>{if(e.key==='Enter')f()};
}
function reward(s){
 const a=s.artifact;
 if(s.id===3){finale();return}
 modal(`<h2>Točno!</h2><p class="sub">Otključao si artefakt</p>
 <div class="item"><div class="ico">${a.icon}</div><div><b>${a.name}</b><span>${a.desc}</span></div></div>
 <p>${s.next}</p><button class="btn fill" onclick="close()">Nastavi potragu</button>`);
}
function finale(){
 const trophies=STATIONS.map(s=>`<div class="item"><div class="ico">${s.artifact.icon}</div><div><b>${s.artifact.name}</b><span>${s.name}</span></div></div>`).join('');
 modal(`<h2>Čestitamo, tragaču!</h2><p class="sub">Škrinja je otvorena. Potraga je završena.</p>
 ${trophies}
 <p>Ostavi tajnu poruku za buduće sebe. Sprema se samo u ovom pregledniku.</p>
 <textarea id="msg" rows="3" maxlength="300" placeholder="Moja tajna poruka iz Dalja...">${S.msg.replace(/</g,'&lt;')}</textarea>
 <div class="row"><button class="btn" onclick="close()">Zatvori</button><button class="btn fill" id="saveMsg">Spremi poruku</button></div>`);
 $('saveMsg').onclick=()=>{S.msg=$('msg').value;save();toast("Poruka je spremljena.");close()};
}
function bag(){
 const items=STATIONS.map(s=>solved(s.id)
  ?`<div class="item"><div class="ico">${s.artifact.icon}</div><div><b>${s.artifact.name}</b><span>${s.artifact.desc}</span></div></div>`
  :`<div class="item lock"><div class="ico">❔</div><div><b>Nepoznati artefakt</b><span>Riješi postaju ${s.id}.</span></div></div>`).join('');
 const m=S.msg?`<p class="sub">Tvoja tajna poruka</p><p>${S.msg.replace(/</g,'&lt;')}</p>`:'';
 modal(`<h2>Ruksak</h2><p class="sub">${S.solved.length}/3 artefakta</p>${items}${m}<button class="btn" onclick="close()">Zatvori</button>`);
}
$('bagBtn').onclick=bag;
refresh();startGPS();
</script>
</body>
</html>
